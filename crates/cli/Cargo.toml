[package]
name = "spotify-cli"
description = "Import and query Spotify data exports"
edition.workspace = true
version.workspace = true

# Published as the `spotify` ortzi package (see ortzi.yaml).
[[bin]]
name = "spotify"
path = "src/main.rs"

[dependencies]
spotify-export = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
cynic = "3.14.0"
indicatif = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
walkdir = "2.5.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[build-dependencies]
cynic-codegen = "3.14.0"
