[workspace]
resolver = "3"
members = ["crates/export", "crates/server", "crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
spotify-export = { path = "crates/export" }
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
hex = "0.4"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-rustls", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.32.1"
opentelemetry-semantic-conventions = { version = "0.32.1", features = ["semconv_experimental"] }
axum-tracing-opentelemetry = "0.39.1"
reqwest-middleware = { version = "0.5.2", features = ["json", "query", "form"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
futures-util = "0.3.34"
tracing-futures = "0.2.5"
async-trait = "0.1.92"
