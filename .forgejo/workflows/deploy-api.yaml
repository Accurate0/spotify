name: Deploy api
on:
  push:
    branches:
      - main
    paths:
      - crates/server/**
      - crates/export/**
      - crates/cli/**
      - .sqlx/**
      - schema.graphql
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - .forgejo/workflows/deploy-api.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: spotify
      build-args: |
        BINARY_NAME=spotify-server

  deploy:
    needs:
      - build
    uses: anurag/workflows/.forgejo/workflows/promote-image.yaml@main
    with:
      app: spotify
      image: registry.anurag.sh/containers/spotify
      digest: ${{ needs.build.outputs.digest }}
