name: Deploy api
on:
  push:
    branches:
      - main
    paths:
      - crates/server/**
      - crates/export/**
      - crates/cli/**
      - .sqlx/**
      - schema.graphql
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - .forgejo/workflows/deploy-api.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: spotify
      build-args: |
        BINARY_NAME=spotify-server

  deploy:
    needs:
      - build
    uses: anurag/workflows/.forgejo/workflows/deploy-image.yaml@main
    with:
      service-name: spotify-api
      images: registry.anurag.sh/containers/spotify
      manifests-path: projects/spotify
      values-file: projects/spotify/image.values.yaml
      tag: ${{ github.sha }}
    secrets:
      CI_IMAGE_UPDATER_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
