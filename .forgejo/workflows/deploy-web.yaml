name: Deploy web
on:
  push:
    branches:
      - main
    paths:
      - web/**
      - schema.graphql
      - .forgejo/workflows/deploy-web.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: spotify-web
      dockerfile: web/Dockerfile
