name: Deploy web
on:
  push:
    branches:
      - main
    paths:
      - web/**
      - schema.graphql
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

jobs:
  build:
    permissions:
      packages: write

    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ghcr.io/accurate0/spotify-web:latest,ghcr.io/accurate0/spotify-web:${{ github.sha }}
          cache-from: type=gha,scope=spotify-web
          cache-to: type=gha,mode=max,scope=spotify-web

  deploy:
    needs:
      - build
    uses: Accurate0/workflows/.github/workflows/deploy-app-k8s-v2.yaml@ac9012a26474aa89e9ab8f6926d64ca34c9dc36c # main
    with:
      service-name: spotify-web
      images: ghcr.io/accurate0/spotify-web
      manifests-path: projects/spotify
      values-file: projects/spotify/image.values.yaml
      tag: ${{ github.sha }}
    secrets:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_CI_IMAGE_UPDATER }}
