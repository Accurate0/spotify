  homeGarageDoor(id: IdOrAlias!): HomeGarageDoorEntity!
  homeAirPurifier(id: IdOrAlias!): HomeAirPurifierEntity!
  homeSolar: HomeSolarObject!
  homeEnergy: HomeEnergyObject!
  homeWeather(input: HomeWeatherInput!): HomeWeatherObject!
  homeWoolworths: HomeWoolworthsObject!
  homeTransperth: HomeTransperthObject!
