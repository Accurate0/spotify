type Account implements Node {
	id: ID!
	slug: String!
	displayName: String!
	spotifyUsername: String
	playCount: Int!
	exports: [Export!]!
}

type Album {
	name: String!
	artist: Artist
}

type Artist implements Node {
	id: ID!
	name: String!
	stats(filter: StatsFilter! = {accounts: [], from: null, to: null, kinds: [TRACK], minMsPlayed: 30000, timeZone: "Australia/Perth"}): Stats!
}

type ArtistConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ArtistEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Artist!]!
}

"""
An edge in a connection.
"""
type ArtistEdge {
	"""
	The item at the end of the edge
	"""
	node: Artist!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

enum BreakdownDimension {
	"""
	Device family: Android, iOS, macOS, Windows, Linux, Web player, Other.
	"""
	DEVICE
	"""
	Country the stream was played from.
	"""
	COUNTRY
	SHUFFLE
	OFFLINE
	"""
	Why playback started (finished previous track, skipped forward, picked, ...).
	"""
	START_REASON
	"""
	Why playback ended.
	"""
	END_REASON
}

type BreakdownRow {
	"""
	Raw value, e.g. `fwdbtn` or `AU`; null when the export doesn't record it.
	"""
	key: String
	"""
	Human-readable form of `key`.
	"""
	label: String!
	plays: Int!
	minutesPlayed: Int!
}

input CreateAccountInput {
	"""
	Lowercase identifier used by the CLI, e.g. `me`.
	"""
	slug: String!
	displayName: String
}

type CreateAccountPayload {
	account: Account!
}

input CreateExportInput {
	"""
	Account slug.
	"""
	account: String!
	"""
	Where the export came from, e.g. its directory name.
	"""
	label: String!
	"""
	Newest timestamp in the export's files. When exports overlap, the newer one's values win.
	"""
	asOf: DateTime!
}

type CreateExportPayload {
	export: Export!
}

"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

type DayStat {
	date: NaiveDate!
	plays: Int!
	minutesPlayed: Int!
	"""
	The artist with the most listening that day.
	"""
	topArtist: Artist
}

type Discovery {
	artist: Artist!
	"""
	First play ever (within the filter's accounts and kinds), which falls in the range.
	"""
	firstPlayed: DateTime!
	"""
	The first track heard by this artist.
	"""
	firstItem: Item
	"""
	Plays in the range.
	"""
	plays: Int!
	minutesPlayed: Int!
}

type DiscoveryConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [DiscoveryEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Discovery!]!
}

"""
An edge in a connection.
"""
type DiscoveryEdge {
	"""
	The item at the end of the edge
	"""
	node: Discovery!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type Export implements Node {
	id: ID!
	label: String!
	asOf: DateTime!
	createdAt: DateTime!
	finalizedAt: DateTime
	account: Account!
	files: [ExportFile!]!
}

type ExportFile implements Node {
	id: ID!
	name: String!
	kind: FileKind!
	sha256: String!
	rowsTotal: Int!
	rowsInserted: Int!
	rowsMerged: Int!
	importedAt: DateTime!
	export: Export!
}

enum FileKind {
	EXTENDED_AUDIO
	EXTENDED_VIDEO
	ACCOUNT_STREAMING_HISTORY
	LIBRARY
	PLAYLIST
	SEARCH_QUERIES
	FOLLOW
	MARQUEE
	INFERENCES
	USERDATA
	PRIVATE
}

input FinalizeExportInput {
	exportId: ID!
}

type FinalizeExportPayload {
	export: Export!
}

type ForgottenArtist {
	artist: Artist!
	plays: Int!
	minutesPlayed: Int!
	lastPlayed: DateTime!
}

type ForgottenArtistConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ForgottenArtistEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [ForgottenArtist!]!
}

"""
An edge in a connection.
"""
type ForgottenArtistEdge {
	"""
	The item at the end of the edge
	"""
	node: ForgottenArtist!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type HeatmapCell {
	"""
	ISO day of week: 1 is Monday, 7 is Sunday.
	"""
	dayOfWeek: Int!
	hour: Int!
	plays: Int!
	minutesPlayed: Int!
}

type Item implements Node {
	id: ID!
	uri: String!
	kind: ItemKind!
	name: String
	"""
	The artist for tracks, the show for episodes, the book for audiobook chapters.
	"""
	artistName: String
	artist: Artist
	album: Album
	stats(filter: StatsFilter! = {accounts: [], from: null, to: null, kinds: [TRACK], minMsPlayed: 30000, timeZone: "Australia/Perth"}): Stats!
}

type ItemConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ItemEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Item!]!
}

"""
An edge in a connection.
"""
type ItemEdge {
	"""
	The item at the end of the edge
	"""
	node: Item!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

enum ItemKind {
	TRACK
	EPISODE
	AUDIOBOOK
}

type ListeningDays {
	"""
	Days with at least one play.
	"""
	activeDays: Int!
	"""
	Days from the first to the last play, inclusive.
	"""
	spanDays: Int!
	"""
	Longest run of consecutive active days.
	"""
	longestStreak: Streak
	"""
	The run ending on the last active day.
	"""
	latestStreak: Streak
}

type Mutation {
	createAccount(input: CreateAccountInput!): CreateAccountPayload!
	createExport(input: CreateExportInput!): CreateExportPayload!
	uploadExportFile(input: UploadExportFileInput!, file: Upload!): UploadExportFilePayload!
	finalizeExport(input: FinalizeExportInput!): FinalizeExportPayload!
}

"""
ISO 8601 calendar date without timezone.
Format: %Y-%m-%d

# Examples

* `1994-11-13`
* `2000-02-24`
"""
scalar NaiveDate

interface Node {
	id: ID!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type Play {
	"""
	When playback ended.
	"""
	ts: DateTime!
	msPlayed: Int!
	skipped: Boolean
	"""
	False for account-data plays, which have minute precision and no item.
	"""
	isExtended: Boolean!
	name: String
	artistName: String
	item: Item
	account: Account!
}

type PlayConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [PlayEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Play!]!
}

"""
An edge in a connection.
"""
type PlayEdge {
	"""
	The item at the end of the edge
	"""
	node: Play!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type Query {
	node(id: ID!): Node
	nodes(ids: [ID!]!): [Node]!
	accounts: [Account!]!
	account(slug: String!): Account
	"""
	Listening stats across the filtered plays.
	"""
	stats(filter: StatsFilter! = {accounts: [], from: null, to: null, kinds: [TRACK], minMsPlayed: 30000, timeZone: "Australia/Perth"}): Stats!
	"""
	Search tracks, episodes and artists by name.
	"""
	search(query: String!): Search!
	item(uri: String!): Item
	artist(name: String!): Artist
	"""
	Whether a file with this sha256 has already been imported for the account, so clients
	can skip uploading it.
	"""
	fileExists(account: String!, sha256: String!): Boolean!
}

enum RankBy {
	MINUTES_PLAYED
	PLAYS
}

type RankedAlbumConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [RankedAlbumEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Album!]!
}

"""
An edge in a connection.
"""
type RankedAlbumEdge {
	"""
	The item at the end of the edge
	"""
	node: Album!
	"""
	1-based position in the ranking.
	"""
	rank: Int!
	plays: Int!
	minutesPlayed: Int!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type RankedArtistConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [RankedArtistEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Artist!]!
}

"""
An edge in a connection.
"""
type RankedArtistEdge {
	"""
	The item at the end of the edge
	"""
	node: Artist!
	"""
	1-based position in the ranking.
	"""
	rank: Int!
	plays: Int!
	minutesPlayed: Int!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type RankedItemConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [RankedItemEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Item!]!
}

"""
An edge in a connection.
"""
type RankedItemEdge {
	"""
	The item at the end of the edge
	"""
	node: Item!
	"""
	1-based position in the ranking.
	"""
	rank: Int!
	plays: Int!
	minutesPlayed: Int!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type RepeatDay {
	item: Item!
	"""
	The day this item was played most.
	"""
	date: NaiveDate!
	plays: Int!
}

type Search {
	items(first: Int, after: String): ItemConnection!
	artists(first: Int, after: String): ArtistConnection!
}

type Session {
	start: DateTime!
	end: DateTime!
	plays: Int!
	minutesPlayed: Int!
}

type Sessions {
	"""
	Listening sessions: plays separated by less than 30 minutes of silence.
	"""
	count: Int!
	averageMinutes: Float
	longest: Session
}

type SkippedItem {
	item: Item!
	"""
	Plays where the export records whether it was skipped.
	"""
	plays: Int!
	skips: Int!
	skipRate: Float!
}

type Stats {
	summary: Summary!
	topArtists(first: Int, after: String, by: RankBy! = MINUTES_PLAYED): RankedArtistConnection!
	"""
	Only plays with an item (extended history) are ranked; account-data plays have none.
	"""
	topItems(first: Int, after: String, by: RankBy! = MINUTES_PLAYED): RankedItemConnection!
	topAlbums(first: Int, after: String, by: RankBy! = MINUTES_PLAYED): RankedAlbumConnection!
	timeline(bucket: TimeBucket!): [TimelinePoint!]!
	"""
	Listening by day of week and hour, in the filter's time zone. Empty cells are omitted.
	"""
	heatmap: [HeatmapCell!]!
	"""
	Individual plays, most recent first.
	"""
	plays(first: Int, after: String): PlayConnection!
	"""
	The earliest play: for an artist or track, when you first heard it.
	"""
	firstPlay: Play
	"""
	Active days and streaks of consecutive days.
	"""
	listeningDays: ListeningDays!
	"""
	Days with the most listening, each with its top artist.
	"""
	topDays(first: Int! = 10): [DayStat!]!
	"""
	Items played most within a single day, one entry per item.
	"""
	onRepeat(first: Int! = 10): [RepeatDay!]!
	"""
	Highest skip rates among items with at least `minPlays` plays. Counts every play,
	whatever the filter's minimum play length.
	"""
	mostSkipped(first: Int! = 10, minPlays: Int! = 10): [SkippedItem!]!
	"""
	Listening split by device, country, shuffle, offline or start/end reason.
	"""
	breakdown(by: BreakdownDimension!): [BreakdownRow!]!
	sessions: Sessions!
	"""
	Artists first heard within the date range, by listening in the range.
	"""
	discoveries(first: Int, after: String): DiscoveryConnection!
	"""
	Artists with heavy listening but nothing in the last year of the range.
	"""
	forgottenArtists(first: Int, after: String): ForgottenArtistConnection!
}

input StatsFilter {
	"""
	Accounts to include; empty means all.
	"""
	accounts: [ID!]! = []
	"""
	Inclusive start.
	"""
	from: DateTime
	"""
	Exclusive end.
	"""
	to: DateTime
	"""
	Item kinds to include. Account-data plays have no kind and count as tracks.
	"""
	kinds: [ItemKind!]! = [TRACK]
	"""
	Ignore plays shorter than this. Defaults to Spotify's 30 second stream threshold; use
	0 to include skips.
	"""
	minMsPlayed: Int! = 30000
	"""
	IANA time zone for timeline buckets and the heatmap.
	"""
	timeZone: String! = "Australia/Perth"
}

type Streak {
	start: NaiveDate!
	end: NaiveDate!
	days: Int!
}

type Summary {
	plays: Int!
	minutesPlayed: Int!
	distinctTracks: Int!
	distinctArtists: Int!
	"""
	Share of plays marked skipped, among plays where the export records it.
	"""
	skipRate: Float
	firstPlayed: DateTime
	lastPlayed: DateTime
}

enum TimeBucket {
	DAY
	WEEK
	MONTH
	YEAR
}

type TimelinePoint {
	"""
	Start of the bucket in the filter's time zone.
	"""
	start: DateTime!
	plays: Int!
	minutesPlayed: Int!
}

"""
A multipart file upload
"""
scalar Upload

input UploadExportFileInput {
	exportId: ID!
	"""
	The file's name inside the export, used to detect its kind.
	"""
	name: String!
	"""
	Hex sha256 of the file, verified by the server.
	"""
	sha256: String!
}

type UploadExportFilePayload {
	status: UploadStatus!
	file: ExportFile
}

enum UploadStatus {
	IMPORTED
	"""
	Already imported for this account; nothing was changed.
	"""
	DUPLICATE
	"""
	The file kind is not imported.
	"""
	UNSUPPORTED
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
	mutation: Mutation
}
