[package]
name = "spotify-server"
edition.workspace = true
version.workspace = true

[[bin]]
name = "spotify-server"
path = "src/main.rs"

[dependencies]
spotify-export = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-graphql = { version = "7.2.1", features = ["chrono", "tempfile"] }
async-graphql-axum = "7.2.1"
axum = "0.8.9"
base64 = "0.23.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "tls-rustls", "migrate", "chrono", "derive", "macros"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }

