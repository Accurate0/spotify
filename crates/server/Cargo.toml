[package]
name = "spotify-server"
edition.workspace = true
version.workspace = true

[[bin]]
name = "spotify-server"
path = "src/main.rs"

[dependencies]
spotify-export = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-graphql = { version = "7.2.1", features = ["chrono", "tempfile", "dataloader"] }
async-graphql-axum = "7.2.1"
axum = "0.8.9"
base64 = "0.23.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "tls-rustls", "migrate", "chrono", "derive", "macros", "json"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
bytes = "1.12.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
