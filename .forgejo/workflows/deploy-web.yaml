name: Deploy web
on:
  push:
    branches:
      - main
    paths:
      - web/**
      - schema.graphql
      - .forgejo/workflows/deploy-web.yaml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build:
    uses: anurag/workflows/.forgejo/workflows/build-push-image.yaml@main
    with:
      directory: .
      image-name: spotify-web
      dockerfile: web/Dockerfile

  deploy:
    needs:
      - build
    uses: anurag/workflows/.forgejo/workflows/deploy-image.yaml@main
    with:
      service-name: spotify-web
      images: registry.anurag.sh/containers/spotify-web
      manifests-path: projects/spotify
      values-file: projects/spotify/image.values.yaml
      tag: ${{ github.sha }}
    secrets:
      CI_IMAGE_UPDATER_TOKEN: ${{ secrets.CI_IMAGE_UPDATER_TOKEN }}
