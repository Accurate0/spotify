[workspace]
resolver = "3"
members = ["crates/export", "crates/server", "crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
spotify-export = { path = "crates/export" }
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
hex = "0.4"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
